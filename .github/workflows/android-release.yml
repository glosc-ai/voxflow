name: Android Release

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed ABI APKs
    if: >-
      (github.event_name == 'release') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Validate release source
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          release_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release tag must point to a commit reachable from main."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Validate protected release configuration
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          required=(
            ANDROID_KEY_BASE64
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured for the android-release environment."
              exit 1
            fi
          done

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/voxflow-release.jks"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "VOXFLOW_ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Build signed ABI APKs
        env:
          VOXFLOW_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VOXFLOW_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VOXFLOW_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: Verify signatures and write checksums
        id: verify
        shell: bash
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          apk_dir="$GITHUB_WORKSPACE/build/app/outputs/flutter-apk"
          apks=(
            "$apk_dir/app-armeabi-v7a-release.apk"
            "$apk_dir/app-arm64-v8a-release.apk"
            "$apk_dir/app-x86_64-release.apk"
          )
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner" || ! -x "$apksigner" ]]; then
            echo "::error::apksigner was not found in the Android SDK."
            exit 1
          fi
          normalize_digest() {
            tr -d ' :\r\n' | tr '[:lower:]' '[:upper:]'
          }
          certificate_path="$RUNNER_TEMP/voxflow-release-cert.der"
          "$JAVA_HOME/bin/keytool" -exportcert \
            -keystore "$VOXFLOW_ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file "$certificate_path" >/dev/null
          expected="$(sha256sum "$certificate_path" | awk '{print $1}' | normalize_digest)"
          rm -f -- "$certificate_path"
          for apk in "${apks[@]}"; do
            if [[ ! -f "$apk" ]]; then
              echo "::error::Missing expected artifact: $(basename "$apk")"
              exit 1
            fi
            verification="$($apksigner verify --print-certs "$apk")"
            actual="$(printf '%s\n' "$verification" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | normalize_digest)"
            if [[ -z "$actual" || "$actual" != "$expected" ]]; then
              echo "::error::Unexpected signing certificate for $(basename "$apk")."
              exit 1
            fi
          done
          (
            cd "$apk_dir"
            sha256sum \
              app-armeabi-v7a-release.apk \
              app-arm64-v8a-release.apk \
              app-x86_64-release.apk \
              > android-apk-sha256.txt
          )
          echo "certificate_sha256=$expected" >> "$GITHUB_OUTPUT"

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: voxflow-android-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/android-apk-sha256.txt

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${VOXFLOW_ANDROID_KEYSTORE_PATH:-}" ]]; then
            rm -f -- "$VOXFLOW_ANDROID_KEYSTORE_PATH"
          fi

  publish:
    name: Attach APKs to GitHub Release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signed APKs
        uses: actions/download-artifact@v4
        with:
          name: voxflow-android-${{ github.run_number }}
          path: release-assets

      - name: Attach signed APKs and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release-assets/app-armeabi-v7a-release.apk \
            release-assets/app-arm64-v8a-release.apk \
            release-assets/app-x86_64-release.apk \
            release-assets/android-apk-sha256.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
