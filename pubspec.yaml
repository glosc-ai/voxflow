name: voxflow
description: "A cross-platform AI STT and TTS application for Windows & Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  record: ^5.1.2
  audioplayers: ^6.0.0
  path_provider: ^2.1.3
  file_picker: ^8.0.3
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# record 5.x allows an old Linux implementation that no longer compiles with
# the platform interface required by its Android implementation. Desktop AOT
# snapshots compile every registered implementation, so keep a compatible pair.
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.20
  record_linux: 1.3.1
  record_platform_interface: 1.5.0

flutter:
  uses-material-design: true
